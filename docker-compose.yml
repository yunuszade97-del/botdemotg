services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # Прайс и FAQ правятся без пересборки образа.
      - ./content:/app/content:ro
      # Профиль клиента (название, вопросы квалификации, витрина) — так же.
      - ./profiles:/app/profiles:ro
      - bot-data:/app/data
    environment:
      DB_PATH: /app/data/bot.sqlite3
    # Проверка перед запуском:
    #   docker compose run --rm bot python -m app.preflight

volumes:
  bot-data:
